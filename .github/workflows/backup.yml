name: Backup to Google Drive

# on:
#   push:
#     branches:
#       - main
#   workflow_dispatch:
#   schedule:
#     - cron: '0 8 * * *'  # 12 AM PST = 8 AM UTC
    
jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # Checkout code if needed
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up SSH key using the ssh-agent action
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Debug step: Check if the SSH key is loaded
      - name: Debug SSH Key Setup
        run: |
          echo "SSH private key loaded:"
          ssh-add -l  # This will list the loaded SSH keys

      # Add remote host to known hosts to avoid SSH verification failures
      - name: Add remote host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
          cat ~/.ssh/known_hosts  # Verify the known hosts file

      # Copy the filter file to the remote server before the backup starts
      - name: Copy filter file to remote server
        run: |
          scp -i ~/.ssh/id_ed25519 rclone-backup-filter.txt ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/home/${{ secrets.REMOTE_USER }}/rclone-backup-filter.txt

      # Run your backup command on the remote server
      - name: Run backup on remote server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            rclone copy / gdrive:/server-backups/$(date +%F) \
              --config ~/.config/rclone/rclone.conf \
              --drive-service-account-file ~/.config/rclone/sa.json \
              --log-level INFO \
              --filter "- /proc/**" \
              --filter "- /sys/**" \
              --filter "- /dev/**" \
              --filter "- /tmp/**" \
              --filter "- /run/**" \
              --filter "- /mnt/**" \
              --filter "- /media/**" \
              --filter "- /lost+found/**" \
              --filter "- /snap/**" \
              --filter "- /var/cache/**" \
              --filter "- /var/tmp/**" \
              --filter "- /var/run/**" \
              --filter "- /swapfile" \
              --filter "+ /etc/**" \
              --filter "+ /home/**" \
              --filter "+ /root/**" \
              --filter "+ /var/www/**" \
              --filter "+ /usr/local/**" \
              --filter "- **" \
              --create-empty-src-dirs
          EOF

