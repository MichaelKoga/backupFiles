name: Remote Server Backup to Google Drive

on:
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository (optional, depending on if you're storing rclone config or other scripts)
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up SSH key
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Set up rclone config file on the remote server (if not already present)
      - name: Set up rclone config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      # Install rclone on remote host (optional)
      - name: Install rclone on remote server
        run: |
          ssh -t -i ~/.ssh/id_ed25519 ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            curl https://rclone.org/install.sh | sudo bash
          EOF

      # Run rclone backup from remote server to Google Drive
      - name: Run backup on remote server
        run: |
          ssh -t -i ~/.ssh/id_rsa ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            DATE=$(date +%Y-%m-%d)
            rclone copy / \
              gdrive:/backups/$DATE \
              --create-dirs \
              --exclude "/bin/**" \
              --exclude "/boot/**" \
              --exclude "/dev/**" \
              --exclude "/lib*/**" \
              --exclude "/lost+found/**" \
              --exclude "/media/**" \
              --exclude "/mnt/**" \
              --exclude "/proc/**" \
              --exclude "/run/**" \
              --exclude "/sbin/**" \
              --exclude "/snap/**" \
              --exclude "/srv/**" \
              --exclude "/sys/**" \
              --exclude "/tmp/**" \
              --exclude "/var/log/**" \
              --exclude "/var/tmp/**" \
              --include "/etc/**" \
              --include "/home/**" \
              --include "/opt/**" \
              --include "/root/**" \
              --include "/usr/local/**" \
              --include "/var/www/**" \
              --include "/srv/data/**"
          EOF

