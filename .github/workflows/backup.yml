name: Backup to Google Drive

on:
  push:
    branches:
      - main

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # Checkout code if needed
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up SSH key using the ssh-agent action
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Debug step: Check if the SSH key is loaded
      - name: Debug SSH Key Setup
        run: |
          echo "SSH private key loaded:"
          ssh-add -l  # This will list the loaded SSH keys

      # Add remote host to known hosts to avoid SSH verification failures
      - name: Add remote host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts
          cat ~/.ssh/known_hosts  # Verify the known hosts file

      # Run your backup command on the remote server
      - name: Run backup on remote server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            rclone copy / \
              gdrive:/server-backups/$(date +%F) \
              --config ~/.config/rclone/rclone.conf \
              --drive-service-account-file ~/.config/rclone/sa.json \
              --log-level INFO \
              --exclude /proc/** \
              --exclude /sys/** \
              --exclude /dev/** \
              --exclude /tmp/** \
              --exclude /run/** \
              --exclude /mnt/** \
              --exclude /media/** \
              --exclude /lost+found/** \
              --exclude /snap/** \
              --exclude /var/cache/** \
              --exclude /var/tmp/** \
              --exclude /var/run/** \
              --exclude /swapfile \
              --include /etc/** \
              --include /home/** \
              --include /root/** \
              --include /var/www/** \
              --include /usr/local/** \
              --create-empty-src-dirs
          EOF

